# Classical STANDALONE draft on the RedHat FP8 8B (fits 12GB; Meta BF16 does not).
engine: sglang
method: classic
base_url: http://127.0.0.1:30000/v1
port: 30000
gpu_id: 1
base_gpu_id: 1
gpu_index: 1
model: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
dtype: auto
tensor_parallel_size: 1
mem_fraction_static: 0.72
max_model_len: 1024
disable_cuda_graph: true
max_tokens: 256
temperature: 0.0
concurrency: 1
max_wait_s: 900
enable_metrics: true
prompts: prompts/warmup.jsonl
speculative:
  algorithm: STANDALONE
  draft_model: meta-llama/Llama-3.2-1B-Instruct
  num_steps: 5
  eagle_topk: 1
  num_draft_tokens: 6
  draft_quantization: fp8
