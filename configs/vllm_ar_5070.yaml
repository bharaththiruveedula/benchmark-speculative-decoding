# Local 2x RTX 5070 (12GB). BF16 8B does not fit on one card; use FP8.
engine: vllm
method: ar
base_url: http://127.0.0.1:8000/v1
port: 8000
gpu_id: 0
cuda_visible_devices: "0"
model: meta-llama/Llama-3.1-8B-Instruct
dtype: auto
quantization: fp8
tensor_parallel_size: 1
gpu_memory_utilization: 0.95
max_model_len: 2048
max_tokens: 256
temperature: 0.0
concurrency: 1
max_wait_s: 600
gpu_index: 0
prompts: prompts/warmup.jsonl
