# Classical speculative decoding: 8B target + 1B draft. Restarts vLLM; 12GB is tight.
engine: vllm
method: classic
base_url: http://127.0.0.1:8000/v1
port: 8000
gpu_id: 0
cuda_visible_devices: "0"
gpu_index: 0
model: meta-llama/Llama-3.1-8B-Instruct
dtype: auto
quantization: fp8
tensor_parallel_size: 1
gpu_memory_utilization: 0.93
max_model_len: 1024
enforce_eager: true
max_tokens: 256
temperature: 0.0
concurrency: 1
max_wait_s: 900
prompts: prompts/warmup.jsonl
speculative_config:
  method: draft_model
  model: meta-llama/Llama-3.2-1B-Instruct
  num_speculative_tokens: 5
  quantization: fp8
  max_model_len: 2048
