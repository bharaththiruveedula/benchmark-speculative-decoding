# EAGLE-3 SpecForge checkpoint — not interchangeable with vLLM yuhuili/Nebius.
engine: sglang
method: eagle3
base_url: http://127.0.0.1:30000/v1
port: 30000
gpu_id: 1
base_gpu_id: 1
gpu_index: 1
model: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
